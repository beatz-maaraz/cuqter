  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #BDA6CE;
      background-size: 100% 100%;
      overflow: hidden;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {

      left: 50%;

    }

    .bottomLeft {

    }

    }

    #splash, #splash-branding {
      transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      const branding = document.getElementById("splash-branding");
      if (splash) {
        splash.style.opacity = "0";
        setTimeout(function() { splash.remove(); }, 320);
      }
      if (branding) {
        branding.style.opacity = "0";
        setTimeout(function() { branding.remove(); }, 320);
      }
      document.body.style.background = "transparent";
      document.body.style.overflow = "auto";
    }

    // Automatically remove web splash as soon as the Flutter engine renders first frame
    window.addEventListener('flutter-first-frame', function() {
      removeSplashFromWeb();
    });
  </script>
